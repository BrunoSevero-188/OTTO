<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050812">
<title>OTTO · Assistente pessoal</title>
<style>
:root{color-scheme:dark;--bg:#050812;--line:#21304a;--text:#e8f2ff;--muted:#8ba0bc;--cyan:#2dd4ff;--blue:#168cff;--violet:#8b5cf6;--green:#44e1a2;--danger:#ff647c}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{min-height:100vh;background:radial-gradient(ellipse at 50% -15%,#11284a 0,transparent 55%),linear-gradient(180deg,#070d1a,#03060d);overflow-x:hidden}button,input,textarea,select{font:inherit}button{color:inherit;cursor:pointer}
#boot,#activation{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#050812;transition:opacity .7s ease}.boot-title,.activation-title{font:800 clamp(3.1rem,12vw,7rem)/1 ui-monospace,monospace;letter-spacing:.22em;padding-left:.22em;background:linear-gradient(90deg,var(--cyan),var(--blue),var(--violet));color:transparent;background-clip:text;text-shadow:0 0 55px #168cff35}.boot-rule{width:min(62vw,440px);height:2px;margin:25px 0;background:linear-gradient(90deg,transparent,var(--cyan),var(--violet),transparent);animation:pulse 1.5s infinite}.boot-sync,.boot-version,.activation-hint{color:var(--muted);font:12px ui-monospace,monospace;letter-spacing:.2em}.boot-sync{animation:blink 1s steps(2,start) infinite}.boot-version{position:absolute;bottom:28px;color:#52617a}.fade{opacity:0;pointer-events:none}#activation{display:none;gap:30px}#activation.show{display:flex}
.primary{border:1px solid #45caff99;background:linear-gradient(120deg,#0876bd,#4b49b5);padding:14px 22px;border-radius:9px;font:700 13px ui-monospace,monospace;letter-spacing:.09em;box-shadow:0 0 28px #168cff32}.primary:hover{filter:brightness(1.16)}#app{display:none;max-width:1120px;margin:0 auto;padding:20px clamp(12px,3vw,34px) 32px}#app.show{display:block}#topbar{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:4px 0 14px}.brand{font:800 19px ui-monospace,monospace;letter-spacing:.22em;color:var(--cyan);margin-right:auto}.key-wrap{display:flex;gap:7px;width:min(460px,62vw)}input,textarea,select{color:var(--text);background:#080e1a;border:1px solid var(--line);border-radius:7px;padding:10px;outline:none}input:focus,textarea:focus,select:focus{border-color:#2dd4ff88;box-shadow:0 0 0 3px #2dd4ff12}#apikey{min-width:0;flex:1;font-size:12px}.small-btn,.icon-btn,.brain-btn{background:#0c1626;border:1px solid var(--line);border-radius:7px;padding:9px 12px;color:#c8d9ef}.small-btn:hover,.icon-btn:hover,.brain-btn:hover{border-color:#2dd4ff80;color:var(--cyan)}
#hero{display:grid;justify-items:center;padding:26px 0 20px}.orb-wrap{width:164px;height:164px;display:grid;place-items:center;position:relative;cursor:pointer}.orb{width:116px;height:116px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#a4f3ff 0,#39cfff 11%,#176dcc 42%,#111b65 73%,#080b1d 100%);box-shadow:0 0 27px #2dd4ff65,0 0 75px #168cff38,inset -14px -18px 32px #03081f;animation:idle 4s ease-in-out infinite}.orb-ring{position:absolute;border:1px solid #39cfff65;border-radius:50%;inset:5px;animation:spin 12s linear infinite}.orb-ring:after{content:"";position:absolute;width:8px;height:8px;background:var(--cyan);border-radius:50%;top:15%;left:14%;box-shadow:0 0 13px var(--cyan)}.orb-ring.r2{inset:18px;border-color:#9a79ff55;animation-direction:reverse;animation-duration:18s}.orb-wrap.listening .orb{animation:listen 1.3s ease-in-out infinite}.orb-wrap.thinking .orb{animation:think .55s ease-in-out infinite}.orb-wrap.speaking .orb{animation:listen .8s ease-in-out infinite}.assistant-name{margin-top:8px;font:700 15px ui-monospace,monospace;letter-spacing:.2em;color:#d9ecff}.status{margin-top:7px;color:var(--muted);font:11px ui-monospace,monospace;letter-spacing:.14em}.status.error{color:var(--danger)}
#dialog{width:min(780px,100%);min-height:74px;display:grid;gap:10px;margin:0 auto 16px}.dialog-line{padding:10px 13px;background:#0a1120b8;border-left:2px solid var(--blue);border-radius:0 7px 7px 0;color:#c4d6eb;line-height:1.5;font-size:14px;overflow-wrap:anywhere}.dialog-line.assistant{border-color:var(--violet)}#controls{display:flex;gap:8px;width:min(780px,100%);margin:0 auto 24px}.icon-btn{min-width:43px}#text-input{flex:1;min-width:0}.panel{background:linear-gradient(160deg,#0c1422ed,#080d18ed);border:1px solid var(--line);border-radius:12px;overflow:hidden}.brain-header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line)}.brain-title{font-weight:750;letter-spacing:.07em}.brain-sub{font-size:12px;color:var(--muted);margin-right:auto}.brain-count{font:11px ui-monospace,monospace;color:#bdd0e7}.brain-btn{font-size:17px;padding:5px 11px}#graph-container{height:min(56vw,480px);min-height:310px;width:100%;background:radial-gradient(ellipse,#0b183044,transparent 72%)}#graph-container svg{width:100%;height:100%;display:block}.edge{fill:none;stroke:url(#edgeGradient);stroke-width:1.25;opacity:.47;stroke-dasharray:5 8;animation:dash 12s linear infinite}.ray{stroke-width:1;opacity:.31}.graph-node{cursor:pointer}.node-label{fill:#e0edff;font:12px ui-monospace,monospace;text-anchor:middle}.node-dot{stroke:#d8f1ff77;stroke-width:1}.node-ring{fill:none;stroke-width:1.2;opacity:.45;transform-box:fill-box;transform-origin:center;animation:breathe 2.8s ease-in-out infinite}.core{fill:url(#coreGradient);stroke:#d3bfff;stroke-width:1;filter:url(#glow)}.core-label{font-size:23px;text-anchor:middle;dominant-baseline:central}.pulse-dot{fill:#fff;filter:url(#glow);pointer-events:none}.saved-flash{animation:flash .9s ease-in-out 3}.legend{display:flex;gap:9px 16px;flex-wrap:wrap;align-items:center;padding:12px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}.legend-item{display:flex;gap:6px;align-items:center}.legend-swatch{width:8px;height:8px;border-radius:50%}.injected{margin-left:auto;color:var(--green)}.empty{padding:30px;text-align:center;color:var(--muted);font-size:13px}
#modal-overlay{position:fixed;inset:0;display:none;place-items:center;padding:18px;background:#000a;z-index:30}#modal-overlay.show{display:grid}.modal{width:min(510px,100%);max-height:92vh;overflow:auto;background:#0d1524;border:1px solid #263a57;border-radius:12px;padding:19px;box-shadow:0 25px 90px #000a}.modal h2{margin:0 0 16px;font:700 14px ui-monospace,monospace;letter-spacing:.08em}.modal label{display:block;margin:12px 0 5px;color:var(--muted);font-size:12px}.modal input,.modal textarea,.modal select{width:100%}.modal textarea{min-height:130px;resize:vertical}.modal-actions{display:flex;gap:8px;margin-top:16px}.modal-actions button{flex:1;border:1px solid var(--line);background:#111c2e;border-radius:7px;padding:10px}.modal-actions .danger{color:#ff7f91;border-color:#7b3341}.modal-actions .save{background:#0878bb;border-color:#168cff}.toast{position:fixed;bottom:18px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#142239;border:1px solid var(--line);border-radius:8px;padding:11px 15px;font-size:13px;transition:.2s;z-index:40;max-width:min(92vw,520px);text-align:center}.toast.show{transform:translate(-50%,0);opacity:1}
@keyframes pulse{50%{opacity:1}}@keyframes blink{50%{opacity:.2}}@keyframes idle{50%{transform:scale(1.045);filter:brightness(1.12)}}@keyframes listen{50%{transform:scale(1.11);filter:brightness(1.35)}}@keyframes think{50%{transform:scale(.94);filter:hue-rotate(35deg)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes dash{to{stroke-dashoffset:-120}}@keyframes breathe{50%{opacity:.9;transform:scale(1.24)}}@keyframes flash{50%{filter:drop-shadow(0 0 12px white);opacity:.45}}
@media(max-width:600px){#app{padding-top:12px}.brand{font-size:16px}.key-wrap{width:70vw}#savekey{padding:8px;font-size:10px}.orb-wrap{width:140px;height:140px}.orb{width:98px;height:98px}#graph-container{height:390px;min-height:300px}.brain-sub{display:none}.injected{width:100%;margin-left:0}.brain-header{gap:7px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<section id="boot" aria-label="Inicialização do OTTO"><div class="boot-title">OTTO</div><div class="boot-rule"></div><div class="boot-sync">SINCRONIZANDO DADOS...</div><div class="boot-version">v5.0 · REBUILD</div></section>
<section id="activation" aria-label="Ativação do OTTO"><div class="activation-title">OTTO</div><button id="activate-btn" class="primary">► ATIVAR SISTEMA</button><div class="activation-hint">CLIQUE PARA INICIAR</div></section>
<main id="app">
<header id="topbar"><div class="brand">OTTO</div><div class="key-wrap"><input id="apikey" type="password" autocomplete="off" aria-label="Anthropic API key" placeholder="Cole sua Anthropic API key"><button id="savekey" class="small-btn">SALVAR</button></div></header>
<section id="hero"><div id="orb-wrap" class="orb-wrap" role="button" tabindex="0" aria-label="Ativar escuta para o próximo comando"><div class="orb-ring r1"></div><div class="orb-ring r2"></div><div id="orb" class="orb"></div></div><div class="assistant-name">OTTO</div><div id="status" class="status">AGUARDANDO ATIVAÇÃO</div></section>
<section id="dialog" aria-live="polite"><div id="user-line" class="dialog-line" hidden></div><div id="assistant-line" class="dialog-line assistant" hidden></div></section>
<section id="controls"><button id="mic-btn" class="icon-btn" title="Ligar ou desligar o microfone" aria-label="Microfone">🎙</button><input id="text-input" type="text" placeholder="ou digite e tecle Enter" aria-label="Digite um comando"><button id="send-btn" class="icon-btn" title="Enviar comando" aria-label="Enviar">➤</button><button id="stop-btn" class="icon-btn" title="Interromper a fala" aria-label="Interromper fala">⏹</button></section>
<section class="panel" aria-label="Second Brain"><header class="brain-header"><div class="brain-title">🧠 SECOND BRAIN</div><div class="brain-sub">contexto vivo conectado ao OTTO</div><div id="brain-count" class="brain-count"></div><button id="add-note-btn" class="brain-btn" title="Criar nota">+</button><button id="reload-btn" class="brain-btn" title="Recarregar notas">⟳</button></header><div id="graph-container" aria-label="Grafo de notas"></div><div id="legend" class="legend"></div></section>
</main>
<div id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title"><form id="note-form" class="modal"><h2 id="modal-title">NOTA DO SECOND BRAIN</h2><input id="note-id" type="hidden"><label for="note-title">Título</label><input id="note-title" maxlength="50" required><label for="note-area">Área</label><select id="note-area"><option value="metas">Metas</option><option value="trabalho">Carreira</option><option value="projetos">Projetos</option><option value="financas">Finanças</option><option value="aprendizado">Aprendizado</option><option value="saude">Saúde</option><option value="relacoes">Relações</option><option value="meta">Núcleo</option></select><label for="note-body">Conteúdo</label><textarea id="note-body" required></textarea><div class="modal-actions"><button type="button" id="modal-cancel">Cancelar</button><button type="button" id="modal-delete" class="danger">Excluir</button><button type="submit" class="save">Salvar</button></div></form></div>
<div id="toast" class="toast" role="status"></div>
<script>
"use strict";
(() => {
  const CONFIG={name:"OTTO",address:"senhor",themeColor:"azul reator",persona:"mordomo europeu formal, cortês e perspicaz, com um toque sutil de sarcasmo",wakeWord:"ola otto",voiceGender:"masculina",model:"claude-sonnet-5"};
  const AREA={metas:{label:"Metas",color:"#fbbf24"},trabalho:{label:"Carreira",color:"#ff5547"},projetos:{label:"Projetos",color:"#8b7cff"},financas:{label:"Finanças",color:"#f7931a"},aprendizado:{label:"Aprendizado",color:"#2dd4ff"},saude:{label:"Saúde",color:"#10b981"},relacoes:{label:"Relações",color:"#ec4899"},meta:{label:"Núcleo",color:"#8a90a6"}};
  const DEFAULT_NOTES=[
    {id:"voce",area:"meta",title:"Bruno",body:"Bruno Severo de Oliveira, 21 anos, de Mato Grosso do Sul, Brasil. Sua ocupação ainda está indefinida; tem curiosidade por vários campos do conhecimento humano."},
    {id:"metas-curto",area:"metas",title:"Curso ADS",body:"Concluir nos próximos três meses um projeto do curso de Tecnologia para entregar no início de dezembro."},
    {id:"metas-longo",area:"metas",title:"Top Achadinho",body:"Meta de longo prazo: desenvolver o projeto Top Achadinho, com perfis, presença nas redes sociais, vídeos e fotos de promoções e outras iniciativas relacionadas."},
    {id:"carreira",area:"trabalho",title:"ADS",body:"Estuda Análise e Desenvolvimento de Sistemas (ADS)."},
    {id:"proj-achadinho",area:"projetos",title:"Top Achadinhos",body:"Projeto de perfis e contas em redes sociais para publicar vídeos e fotos de promoções, junto de outras iniciativas relacionadas."},
    {id:"financas",area:"financas",title:"Renda Digital",body:"Objetivo de gerar renda com o Top Achadinhos e o Renda Digital Pro, uma versão voltada a cursos online e produtos digitais."},
    {id:"saude",area:"saude",title:"Academia",body:"Está indo à academia e pretende treinar de segunda a sexta. Avalia sono e alimentação como medianos."},
    {id:"relacoes",area:"relacoes",title:"Relações",body:"Avalia suas relações como entre medianas e boas."}
  ];
  const $=id=>document.getElementById(id);
  const el={boot:$("boot"),activation:$("activation"),app:$("app"),activate:$("activate-btn"),status:$("status"),orb:$("orb-wrap"),user:$("user-line"),answer:$("assistant-line"),key:$("apikey"),saveKey:$("savekey"),input:$("text-input"),send:$("send-btn"),mic:$("mic-btn"),stop:$("stop-btn"),graph:$("graph-container"),legend:$("legend"),count:$("brain-count"),modal:$("modal-overlay"),form:$("note-form"),noteId:$("note-id"),title:$("note-title"),area:$("note-area"),body:$("note-body"),delete:$("modal-delete"),toast:$("toast")};
  let NOTES=loadNotes(),recognition=null,listening=false,busy=false,awaitingCommand=false,history=[],chosenVoice=null,graphAnimation=0,toastTimer=0,lastSavedId="";
  function loadNotes(){
    let saved=[];try{const raw=localStorage.getItem("otto_notes")||localStorage.getItem("jarvis_notes"),parsed=raw?JSON.parse(raw):[];if(Array.isArray(parsed))saved=parsed.filter(n=>n&&typeof n.id==="string"&&AREA[n.area]&&typeof n.title==="string"&&typeof n.body==="string");}catch(_){}
    let seedDone=false;try{seedDone=localStorage.getItem("otto_interview_seed_v1")==="done";}catch(_){}if(seedDone)return saved;
    const legacy=new Set(["voce","metas-longo","carreira","proj-achadinho","proj-scraper","proj-gestorx","proj-scanner","financas","aprendizado","saude"]);
    const custom=saved.filter(n=>!legacy.has(n.id)&&n.id!=="metas-curto"&&n.id!=="relacoes");
    const merged=custom.concat(DEFAULT_NOTES.map(n=>({...n})));try{localStorage.setItem("otto_notes",JSON.stringify(merged));localStorage.setItem("otto_interview_seed_v1","done");}catch(_){}return merged;
  }
  function saveNotes(){try{localStorage.setItem("otto_notes",JSON.stringify(NOTES));}catch(_){toast("Não consegui salvar as notas neste navegador.");}}
  function normalize(text){return String(text||"").toLocaleLowerCase("pt-BR").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ").trim();}
  function esc(text){return String(text).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
  function toast(message){el.toast.textContent=message;el.toast.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.toast.classList.remove("show"),3600);}
  function status(text,state){el.status.textContent=text;el.status.className="status"+(state==="error"?" error":"");el.orb.classList.toggle("thinking",state==="thinking");el.orb.classList.toggle("speaking",state==="speaking");el.orb.classList.toggle("listening",state==="listening");}
  function showLine(element,text){element.textContent=text;element.hidden=!text;}
  function chooseVoice(){if(!("speechSynthesis"in window))return;const voices=speechSynthesis.getVoices(),pt=voices.filter(v=>/^pt[-_]/i.test(v.lang));chosenVoice=pt.find(v=>/br/i.test(v.lang)&&/male|mascul|daniel|ricardo|antonio|jorge/i.test(v.name))||pt.find(v=>/br/i.test(v.lang))||pt[0]||null;}
  if("speechSynthesis"in window){chooseVoice();speechSynthesis.onvoiceschanged=chooseVoice;}
  function stopRecognition(){if(recognition)try{recognition.stop();}catch(_){}}
  function startRecognition(){if(!listening||busy||!recognition||document.hidden)return;try{recognition.start();}catch(error){if(error&&error.name!=="InvalidStateError")console.warn("Falha ao iniciar reconhecimento:",error);}}
  function ensureRecognition(){
    if(recognition||!("SpeechRecognition"in window||"webkitSpeechRecognition"in window))return;
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;recognition=new SR();recognition.lang="pt-BR";recognition.continuous=true;recognition.interimResults=false;
    recognition.onresult=event=>{const result=event.results[event.results.length-1];if(result&&result.isFinal&&!busy)handleSpeech(result[0].transcript);};
    recognition.onerror=event=>{if(event.error==="not-allowed"||event.error==="service-not-allowed"){listening=false;status("MICROFONE SEM PERMISSÃO","error");toast("Permita o uso do microfone nas configurações do navegador.");speak("Senhor, o navegador não liberou o microfone. Verifique a permissão do site.");}else if(event.error!=="no-speech"&&event.error!=="aborted")toast("O reconhecimento de voz falhou. Tente novamente ou digite seu comando.");};
    recognition.onend=()=>{if(listening&&!busy){status("OUVINDO · DIGA “OLÁ OTTO”","listening");setTimeout(startRecognition,250);}};
  }
  function speak(text){
    if(!("speechSynthesis"in window)||!text){busy=false;if(listening)startRecognition();return;}
    busy=true;stopRecognition();speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="pt-BR";if(chosenVoice)u.voice=chosenVoice;u.rate=.98;u.pitch=.92;status("FALANDO","speaking");
    u.onend=u.onerror=()=>{busy=false;if(listening){status("OUVINDO · DIGA “OLÁ OTTO”","listening");startRecognition();}else status("OCIOSO");};speechSynthesis.speak(u);
  }
  function handleSpeech(raw){if(busy)return;if(!awaitingCommand){if(normalize(raw).includes(CONFIG.wakeWord)){awaitingCommand=true;status("AGUARDANDO COMANDO","listening");speak("Às suas ordens, senhor. Pode prosseguir.");}return;}awaitingCommand=false;sendCommand(raw);}
  function enableListening(){ensureRecognition();if(!recognition){status("VOZ INDISPONÍVEL NESTE NAVEGADOR","error");toast("A voz exige um navegador com Web Speech API. Você ainda pode digitar.");return false;}listening=true;status("OUVINDO · DIGA “OLÁ OTTO”","listening");startRecognition();return true;}
  function systemPrompt(){
    const grouped=Object.keys(AREA).map(area=>{const notes=NOTES.filter(n=>n.area===area);return notes.length?AREA[area].label+":\n"+notes.map(n=>"- "+n.title+": "+n.body).join("\n"):"";}).filter(Boolean).join("\n\n");
    return "Você é "+CONFIG.name+", um assistente pessoal. Sua personalidade é de "+CONFIG.persona+". Trate o usuário por “"+CONFIG.address+"”.\n\n"+
      "Responda sempre em português do Brasil, com 2 a 4 frases curtas e naturais para falar em voz alta. Não use emojis nem Markdown. Personalize com o Second Brain, sem inventar informações; pergunte com educação quando algo não estiver registrado.\n\n"+
      "SECOND BRAIN COMPLETO (contexto atualizado):\n"+(grouped||"Ainda não há notas.")+"\n\n"+
      "MEMÓRIA VIVA: quando o usuário revelar algo realmente novo e duradouro, termine a resposta com uma linha no formato exato [[SAVE:area|titulo|texto]]. area deve ser metas, trabalho, projetos, financas, aprendizado, saude, relacoes ou meta. Se já existir nota com esse título, atualize-a; caso contrário, crie uma. Não inclua a linha quando não houver informação nova.";
  }
  function processMemory(text){
    const regex=/\[\[SAVE:([a-z_]+)\|([^|]+)\|([\s\S]+?)\]\]/g;let match,clean=text;
    while((match=regex.exec(text))!==null){const area=match[1],title=match[2].trim(),body=match[3].trim();if(!AREA[area]||!title||!body)continue;const old=NOTES.find(n=>normalize(n.title)===normalize(title));
      if(old){old.area=area;old.body=body;lastSavedId=old.id;}else{lastSavedId="note-"+(window.crypto&&crypto.randomUUID?crypto.randomUUID():Date.now().toString(36));NOTES.push({id:lastSavedId,area,title,body});}clean=clean.replace(match[0],"").trim();}
    if(clean!==text){saveNotes();renderGraph();toast("Second Brain atualizado.");}return clean.replace(/\n{3,}/g,"\n\n").trim();
  }
  async function sendCommand(command){
    const text=String(command||"").trim();if(!text||busy)return;showLine(el.user,"O senhor: "+text);el.input.value="";
    const key=el.key.value.trim()||localStorage.getItem("anthropic_key")||"";
    if(!key){const msg="Por gentileza, cole sua chave da Anthropic no campo acima e salve para eu poder responder.";showLine(el.answer,msg);speak(msg);return;}
    history.push({role:"user",content:text});busy=true;stopRecognition();status("PENSANDO","thinking");
    try{
      const response=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true","content-type":"application/json"},body:JSON.stringify({model:CONFIG.model,max_tokens:400,system:systemPrompt(),messages:history})});
      if(!response.ok){const details=await response.text().catch(()=> "");throw new Error("A API respondeu com HTTP "+response.status+(details?".":""));}
      const data=await response.json(),raw=data&&Array.isArray(data.content)?data.content.filter(p=>p.type==="text").map(p=>p.text).join("\n").trim():"";
      const answer=processMemory(raw)||"Não recebi uma resposta em texto. Pode repetir, senhor?";history.push({role:"assistant",content:answer});if(history.length>24)history=history.slice(-24);showLine(el.answer,answer);busy=false;speak(answer);
    }catch(error){busy=false;const msg=error.message&&error.message.startsWith("A API respondeu")?error.message+" Confira sua chave e tente novamente.":"Não consegui conectar à Anthropic. Verifique sua internet e tente novamente, senhor.";showLine(el.answer,msg);status("FALHA NA CONEXÃO","error");speak(msg);}
  }
  function renderGraph(){
    cancelAnimationFrame(graphAnimation);const w=1000,h=540,cx=500,cy=260,n=NOTES.length;
    if(!n){el.graph.innerHTML='<div class="empty">Seu Second Brain está vazio. Use + para criar a primeira nota.</div>';el.legend.replaceChildren();el.count.textContent="0 notas · 0 áreas";return;}
    const points=NOTES.map((note,i)=>{const a=-Math.PI/2+2*Math.PI*i/n;return Object.assign({},note,{x:cx+355*Math.cos(a),y:cy+188*Math.sin(a)});}),edges=[];
    for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)edges.push([i,j]);
    const curve=(a,b)=>{const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;return{x:mx+(cx-mx)*.35,y:my+(cy-my)*.35};};
    const edgeMarkup=edges.map((p,k)=>{const a=points[p[0]],b=points[p[1]],c=curve(a,b);return '<path class="edge" id="edge-'+k+'" d="M '+a.x.toFixed(1)+' '+a.y.toFixed(1)+' Q '+c.x.toFixed(1)+' '+c.y.toFixed(1)+' '+b.x.toFixed(1)+' '+b.y.toFixed(1)+'"/>';}).join("");
    const rays=points.map(p=>'<line class="ray" x1="'+cx+'" y1="'+cy+'" x2="'+p.x.toFixed(1)+'" y2="'+p.y.toFixed(1)+'" stroke="'+AREA[p.area].color+'"/>').join("");
    const nodeMarkup=points.map((p,i)=>{const degree=edges.filter(e=>e[0]===i||e[1]===i).length,r=12+Math.min(8,degree*.3);return '<g class="graph-node '+(p.id===lastSavedId?"saved-flash":"")+'" data-id="'+esc(p.id)+'" tabindex="0" role="button" aria-label="Editar nota '+esc(p.title)+'"><circle class="node-ring" cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="'+(r+7)+'" stroke="'+AREA[p.area].color+'"/><circle class="node-dot" cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="'+r+'" fill="'+AREA[p.area].color+'"/><text class="node-label" x="'+p.x.toFixed(1)+'" y="'+(p.y+r+19).toFixed(1)+'">'+esc(p.title)+'</text></g>';}).join("");
    const pulseMarkup=Array.from({length:12},(_,i)=>'<circle class="pulse-dot" r="'+(i%3===0?3.2:2.3)+'" data-pulse="'+i+'"/>').join("");
    const svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 '+0+' '+w+' '+h+'" role="img" aria-label="Grafo das notas do Second Brain"><defs><linearGradient id="edgeGradient"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#2dd4ff"/></linearGradient><radialGradient id="coreGradient"><stop offset="0%" stop-color="#c3a5ff"/><stop offset="55%" stop-color="#784be7"/><stop offset="100%" stop-color="#321764"/></radialGradient><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>'+rays+edgeMarkup+'<circle class="core" cx="'+cx+'" cy="'+cy+'" r="28"/><text class="core-label" x="'+cx+'" y="'+(cy+1)+'">🧠</text>'+nodeMarkup+pulseMarkup+'</svg>';
    el.graph.innerHTML=svg;el.graph.querySelectorAll(".graph-node").forEach(g=>{g.addEventListener("click",()=>editNote(g.dataset.id));g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();editNote(g.dataset.id);}});});
    const areas=[...new Set(NOTES.map(note=>note.area))];el.legend.innerHTML=areas.map(a=>'<span class="legend-item"><i class="legend-swatch" style="background:'+AREA[a].color+'"></i>'+AREA[a].label+'</span>').join("")+'<span class="injected">✓ contexto injetado em todos os comandos do OTTO</span>';el.count.textContent=n+" notas · "+areas.length+" áreas";
    const paths=edges.map((p,k)=>{const a=points[p[0]],b=points[p[1]];return{element:el.graph.querySelector("#edge-"+k),a,b,c:curve(a,b)};}).filter(p=>p.element);
    const moving=[...el.graph.querySelectorAll(".pulse-dot")].map((element,i)=>({element,edge:paths.length?paths[(i*7+Math.floor(Math.random()*paths.length))%paths.length]:null,t:Math.random(),speed:.0008+Math.random()*.0014}));
    function tick(){if(!el.graph.isConnected)return;moving.forEach(p=>{if(!p.edge)return;p.t=(p.t+p.speed*16)%1;const t=p.t,u=1-t,a=p.edge.a,b=p.edge.b,c=p.edge.c,x=u*u*a.x+2*u*t*c.x+t*t*b.x,y=u*u*a.y+2*u*t*c.y+t*t*b.y;p.element.setAttribute("cx",x.toFixed(2));p.element.setAttribute("cy",y.toFixed(2));p.element.setAttribute("opacity",(0.25+0.75*Math.sin(Math.PI*t)).toFixed(2));});graphAnimation=requestAnimationFrame(tick);}
    graphAnimation=requestAnimationFrame(tick);if(lastSavedId){const saved=lastSavedId;setTimeout(()=>{if(lastSavedId===saved)lastSavedId="";},3000);}
  }
  function editNote(id){const n=NOTES.find(x=>x.id===id);if(!n)return;el.noteId.value=n.id;el.title.value=n.title;el.area.value=n.area;el.body.value=n.body;el.delete.hidden=false;el.modal.classList.add("show");el.title.focus();}
  function newNote(){el.noteId.value="";el.title.value="";el.area.value="projetos";el.body.value="";el.delete.hidden=true;el.modal.classList.add("show");el.title.focus();}
  function closeModal(){el.modal.classList.remove("show");}
  el.form.addEventListener("submit",event=>{event.preventDefault();const id=el.noteId.value||"note-"+(window.crypto&&crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)),note={id,area:el.area.value,title:el.title.value.trim(),body:el.body.value.trim()};if(!note.title||!note.body)return;const index=NOTES.findIndex(n=>n.id===id);if(index>=0)NOTES[index]=note;else NOTES.push(note);lastSavedId=id;saveNotes();closeModal();renderGraph();toast("Nota salva no Second Brain.");});
  el.delete.addEventListener("click",()=>{const id=el.noteId.value;if(!id)return;NOTES=NOTES.filter(n=>n.id!==id);saveNotes();closeModal();renderGraph();toast("Nota excluída.");});
  $("modal-cancel").addEventListener("click",closeModal);el.modal.addEventListener("click",event=>{if(event.target===el.modal)closeModal();});
  $("add-note-btn").addEventListener("click",newNote);
  $("reload-btn").addEventListener("click",()=>{try{const saved=JSON.parse(localStorage.getItem("otto_notes")||"[]");if(Array.isArray(saved))NOTES=saved.filter(n=>n&&AREA[n.area]&&n.title&&n.body);}catch(_){}renderGraph();toast("Second Brain recarregado.");});
  el.saveKey.addEventListener("click",()=>{const key=el.key.value.trim();if(!key){toast("Cole sua chave da Anthropic antes de salvar.");return;}try{localStorage.setItem("anthropic_key",key);toast("Chave salva neste navegador.");}catch(_){toast("Não foi possível salvar a chave no navegador.");}});
  el.send.addEventListener("click",()=>sendCommand(el.input.value));el.input.addEventListener("keydown",event=>{if(event.key==="Enter"){event.preventDefault();sendCommand(el.input.value);}});
  el.mic.addEventListener("click",()=>{if(listening){listening=false;awaitingCommand=false;stopRecognition();status("MICROFONE DESLIGADO");}else enableListening();});
  el.orb.addEventListener("click",()=>{if(!listening)enableListening();awaitingCommand=true;status("AGUARDANDO COMANDO","listening");toast("Diga seu comando, senhor.");});
  el.orb.addEventListener("keydown",event=>{if(event.key==="Enter"||event.key===" "){event.preventDefault();el.orb.click();}});
  el.stop.addEventListener("click",()=>{if("speechSynthesis"in window)speechSynthesis.cancel();busy=false;if(listening){status("OUVINDO · DIGA “OLÁ OTTO”","listening");startRecognition();}else status("OCIOSO");});
  el.activate.addEventListener("click",()=>{el.boot.classList.add("fade");el.activation.classList.remove("show");setTimeout(()=>{el.boot.style.display="none";el.app.classList.add("show");},180);const greeting="Sistemas online. Estou ouvindo, senhor.";showLine(el.answer,greeting);speak(greeting);enableListening();});
  window.addEventListener("load",()=>{try{el.key.value=localStorage.getItem("anthropic_key")||"";}catch(_){}setTimeout(()=>{el.boot.classList.add("fade");setTimeout(()=>{el.boot.style.display="none";el.activation.classList.add("show");},700);},2200);renderGraph();});
  window.addEventListener("beforeunload",()=>cancelAnimationFrame(graphAnimation));
})();
</script>
</body>
